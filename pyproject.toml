[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepretina"
version = "0.1.0"
description = "Reproducible retinal vessel, artery/vein and optic disc/cup segmentation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.6.0",
  "numpy>=1.26,<3",
  "pillow>=10.4",
  "scipy>=1.13",
  "xlrd>=2.0.1",
]

[project.scripts]
deepretina = "deepretina.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/deepretina/**/*.py", "/src/deepretina/adapters/*.json", "/src/deepretina/pretrained/*", "/configs/*.toml", "/docs/*.md", "/scripts/*.py",
  "/tests/*.py", "/reports/**/*.json", "/reports/**/*.csv", "/reports/**/*.md",
  "/README.md", "/pyproject.toml", "/uv.lock", "/.python-version",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deepretina"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
