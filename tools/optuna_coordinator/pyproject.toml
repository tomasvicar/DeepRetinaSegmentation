[project]
name = "deepretina-optuna-coordinator"
version = "0.1.0"
description = "Single-writer local ask/tell control; no ML runtime or transport"
requires-python = ">=3.12,<3.13"
dependencies = ["optuna==5.0.0"]
[dependency-groups]
dev = ["pytest>=8,<10"]
[project.scripts]
deepretina-optuna = "deepretina_optuna.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/deepretina_optuna"]
