# Actual first native TPE proposal recipe; completed60, bundledBEST58.
# Same source72 configuration; portable device=auto is the only preset exception.
# CPU and Pascal GPUs need --mixed-precision none; this is a fresh retraining run.
architecture = "compact_unet"
allow_historical_exposure = false
preprocessing_profile = "legacy25_raw"
pixels_per_degree = 25.0
epochs = 60
epoch_samples = 8192
coverage_first = true
batch_size = 4
patch_size = 384
base_channels = 16
depth = 4
norm = "batch"
lr = 0.000287722894608172
weight_decay = 5.52164819184925e-06
scheduler = "cosine"
min_lr_ratio = 0.05
seed = 42
workers = 8
device = "auto"
sampling = "dataset_task_balanced"
train_view = "patch"
view_size = 512
foreground_probability = 0.5
augmentation = "basic"
bce_weight = 1.0
dice_weight = 1.0
av_weight = 1.0
vessel_loss_weight = 1.0
vessel_pos_weight = 1.0
tile_size = 512
overlap = 64
require_all_heads = true
selection_metric = "macro_dataset_mean_dice"
purpose = "full_data"
vascular_sampling_weight = 2.553934065831788
mixed_precision = "bf16"
